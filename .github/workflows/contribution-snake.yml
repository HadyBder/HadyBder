name: Refresh contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-snake.yml"
      - "scripts/grow_snake.py"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate themed contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#9a6324&color_dots=#efede8,#f1dfc5,#e5c28f,#c9944c,#9a6324
            dist/snake-dark.svg?palette=github-dark&color_snake=#e9bb7b&color_dots=#1b2b32,#493827,#765332,#ad7c43,#dca65f

      - name: Check out profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: profile-source

      - name: Make the snake grow after every eaten contribution
        run: python3 profile-source/scripts/grow_snake.py dist/snake-light.svg dist/snake-dark.svg

      - name: Publish SVGs to the output branch
        shell: bash
        run: |
          set -euo pipefail
          generated_dir="$GITHUB_WORKSPACE/dist"
          output_dir="$RUNNER_TEMP/profile-snake-output"
          cd profile-source
          if git ls-remote --exit-code --heads origin output >/dev/null; then
            git fetch origin output
            git worktree add -b output "$output_dir" FETCH_HEAD
          else
            git worktree add --detach "$output_dir" HEAD
            git -C "$output_dir" switch --orphan output
          fi
          cp "$generated_dir/snake-light.svg" "$generated_dir/snake-dark.svg" "$output_dir/"
          cd "$output_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- snake-light.svg snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution animations are already current."
            exit 0
          fi
          git commit -m "Refresh contribution snake artwork"
          git push origin HEAD:output
