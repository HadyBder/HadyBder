name: Refresh contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate themed contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#346d58&color_dots=#eceee9,#c7dfd2,#92c8ae,#60a283,#346d58
            dist/snake-dark.svg?palette=github-dark&color_snake=#e9bb7b&color_dots=#1b2b32,#294c40,#437b60,#65ae8b,#8ee2c0

      - name: Validate SVGs and respect reduced motion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ("snake-light.svg", "snake-dark.svg"):
              path = Path("dist") / name
              source = path.read_text()
              root = ET.fromstring(source)
              assert root.tag.endswith("svg"), name
              assert "<script" not in source.lower(), name
              assert "@keyframes" in source, "Animation was not generated"
              css = "<style>@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>"
              source = source.replace("</svg>", css + "</svg>")
              ET.fromstring(source)
              path.write_text(source)
          PY

      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: profile-source

      - name: Publish SVGs to the output branch
        shell: bash
        run: |
          set -euo pipefail
          generated_dir="$GITHUB_WORKSPACE/dist"
          output_dir="$RUNNER_TEMP/profile-snake-output"
          cd profile-source
          if git ls-remote --exit-code --heads origin output >/dev/null; then
            git fetch origin output
            git worktree add -b output "$output_dir" FETCH_HEAD
          else
            git worktree add --detach "$output_dir" HEAD
            git -C "$output_dir" switch --orphan output
          fi
          cp "$generated_dir/snake-light.svg" "$generated_dir/snake-dark.svg" "$output_dir/"
          cd "$output_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- snake-light.svg snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution animations are already current."
            exit 0
          fi
          git commit -m "Refresh contribution snake artwork"
          git push origin HEAD:output
